# slam_toolbox LOCALIZATION config for the RoboMaster CoppeliaSim setup.
#
# Same plumbing as slam_toolbox.yaml (M2 mapping), but instead of building a
# map it LOADS the saved map and only localizes in it -- publishing the
# drift-correcting map -> rm0/odom transform without modifying the map. This is
# the localization backbone for Robot A (and later rm1 / Robot B): each robot
# knows where it is in the shared `map` frame.
#
# Differences from slam_toolbox.yaml:
#   - mode: localization   (was mapping)
#   - map_file_name: the serialized posegraph saved from M2 (see below)
#
# IMPORTANT: this publishes map -> rm0/odom, same as ground_truth_localizer.
# Run ONE of them, never both -- they fight over that transform.
slam_toolbox:
  ros__parameters:
    # Wall-clock throughout (sim time breaks the RoboMaster SDK). The scan is
    # restamped to wall time by scan_restamp; SLAM stays on the default ROS clock.
    use_sim_time: false

    # ---- Localization mode ----
    mode: localization
    # Path (WITHOUT extension) to the serialized posegraph saved from M2 via:
    #   ros2 service call /slam_toolbox/serialize_map \
    #     slam_toolbox/srv/SerializePoseGraph "{filename: '<abs>/.../maps/room'}"
    # Produces room.posegraph + room.data; point map_file_name at "<...>/room".
    # NOTE: slam_toolbox does not expand ~ or substitute package paths here --
    # an absolute path is the reliable choice. The goto_localized launch file
    # overrides this with an absolute path resolved from the package share dir.
    map_file_name: maps/room
    # Start localized at the map origin. If the robot starts elsewhere, set an
    # initial pose instead (map_start_pose: [x, y, theta]) or use RViz's
    # "2D Pose Estimate" once running.
    map_start_at_dock: true

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS / frame params -- prefixed to match the bridge's TF tree.
    odom_frame: rm0/odom
    map_frame: map
    base_frame: rm0/base_link
    scan_topic: /rm0/scan_stamped   # wall-clock-restamped scan (see scan_restamp)

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 5.0              # below the lidar's 20 m range_max; ignore no-return fill
    minimum_time_interval: 0.2
    # Small positive lookup tolerance so the scan->odom TF is found instead of
    # dropped (see slam_toolbox.yaml for the full rationale / issue #516).
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
