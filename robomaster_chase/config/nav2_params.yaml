# Nav2 params for the simulated RoboMaster EP (Humble nav2 1.1.5).
#
# Run Nav2 nodes GLOBAL (no namespace). The bridge's TF tree is prefixed
# (map -> rm0/odom -> rm0/base_link -> rm0/laser_link), so every frame param
# below carries the rm0/ prefix EXCEPT the global `map` frame. Topics are
# absolute (/rm0/...). cmd_vel is remapped to /rm0/cmd_vel in the launch file.
#
# Wall-clock throughout (use_sim_time: false) -- sim time breaks the bridge SDK;
# the scan is restamped to wall-clock by scan_restamp (/rm0/scan_stamped).
#
# Localization + /map come from slam_toolbox in localization mode (the single
# map -> rm0/odom owner). The global costmap's static layer subscribes to the
# latched /map it publishes.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    odom_topic: /rm0/odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: True

    # RegulatedPurePursuit: a path follower with an explicit rotate-in-place
    # behavior. This is what makes turns assertive (the old reactive avoidance
    # turned weakly). rotate_to_heading kicks in past rotate_to_heading_min_angle
    # and spins at up to rotate_to_heading_angular_vel with max_angular_accel.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.30          # = MAX_LINEAR_SPEED
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      use_collision_detection: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # --- assertive turning ---
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.50         # rad; rotate in place past this
      rotate_to_heading_angular_vel: 1.20       # = MAX_ANGULAR_SPEED
      max_angular_accel: 2.5                    # rad/s^2; snappy ramp
      max_robot_pose_search_dist: 5.0
      # --- speed regulation (slow on curves / near obstacles) ---
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: false
      allow_reversing: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false        # Dijkstra: reliably routes around walls
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: rm0/odom
    global_frame: map
    robot_base_frame: rm0/base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.20         # = MAX_ANGULAR_SPEED
    min_rotational_vel: 0.40
    rotational_acc_lim: 2.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: rm0/base_link
    odom_topic: /rm0/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # NOTE: plugin_lib_names is intentionally omitted. bt_navigator has a
    # compiled-in default list of BT node plugins; overriding it forces every
    # listed library to load, and this RoboStack 1.1.5 macOS build does NOT ship
    # all of them (e.g. nav2_is_battery_charging_condition_bt_node is missing),
    # which made bt_navigator fail to configure and aborted the whole lifecycle.
    # The defaults cover navigate_to_pose / navigate_through_poses, which is all
    # we use.

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 1.20]      # [vx, vy, vtheta]; matches robot limits
    min_velocity: [-0.30, 0.0, -1.20]
    max_accel: [2.0, 0.0, 3.2]
    max_decel: [-2.0, 0.0, -3.2]
    odom_topic: "/rm0/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: rm0/odom            # rolling window lives in odom
      robot_base_frame: rm0/base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.25
      transform_tolerance: 0.2
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /rm0/scan_stamped
          sensor_frame: rm0/laser_link
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: rm0/base_link
      rolling_window: false
      track_unknown_space: true
      robot_radius: 0.25
      resolution: 0.05
      transform_tolerance: 0.2
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # slam_toolbox publishes /map LATCHED (transient-local); without this the
        # static layer never receives it and the global costmap stays empty ->
        # no walls to plan around.
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /rm0/scan_stamped
          sensor_frame: rm0/laser_link
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true
